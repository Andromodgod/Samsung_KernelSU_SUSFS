name: Build Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Choose Release Type"
        required: true
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions

      lto:
        description: "Choose LTO build"
        required: true
        type: choice
        options:
          - default
          - thin
          - full
        default: full

      ksun:
        description: "BakaSU"
        required: false
        default: true
        type: boolean

      susfs:
        description: "SUSFS"
        required: false
        default: true
        type: boolean

      nomount:
        description: "NoMount"
        required: false
        default: true
        type: boolean

      bbg:
        description: "BBG"
        required: false
        default: true
        type: boolean

      unicodefix:
        description: "Unicode fix"
        required: false
        default: true
        type: boolean

      droidspace:
        description: "Droidspaces"
        required: false
        default: true
        type: boolean

      ntsync:
        description: "NTsync"
        required: false
        default: true
        type: boolean

      bbrv3:
        description: "bbrv3"
        required: false
        default: true
        type: boolean

      cache:
        description: "CCache"
        required: false
        default: true
        type: boolean

      ipv6_nat:
        description: "IPv6_NAT & IP-SET"
        required: false
        default: true
        type: boolean

      optimization:
        description: "optimization patches"
        required: false
        default: true
        type: boolean

      ttl:
        description: "TTL support"
        required: false
        default: true
        type: boolean

jobs:

  build-samsung:
    uses: ./.github/workflows/kernel-samsung.yml
    secrets: inherit
    with:
      susfs: ${{ inputs.susfs }}
      bbg: ${{ inputs.bbg }}
      unicodefix: ${{ inputs.unicodefix }}
      nomount: ${{ inputs.nomount }}
      ksun: ${{ inputs.ksun }}
      droidspace: ${{ inputs.droidspace }}
      ntsync: ${{ inputs.ntsync }}
      bbrv3: ${{ inputs.bbrv3 }}
      cache: ${{ inputs.cache }}
      ipv6_nat: ${{ inputs.ipv6_nat }}
      optimization: ${{ inputs.optimization }}
      ttl: ${{ inputs.ttl }}
      lto: ${{ inputs.lto }}

  release:
    runs-on: ubuntu-latest
    if: inputs.release_type != 'Actions'
    needs:
      - build-samsung

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NAME: "Samsung SM-S928B Normie-Kernel With BakaSU & SUSFS"
      RELEASE_BODY: ""
      NEW_TAG: ""
      BAKASU_HASH: ""
      SUSFS_61: ""
      BBG_HASH: ""
      NM_HASH: ""
    steps:
      - name: Free Disk Space
        if: true
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate New Tag
        if: inputs.release_type != 'Actions'
        run: |
            LATEST_TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[0].name' 2>/dev/null || echo "")
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v2.4.0-r0"
            fi

            NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')

            echo "New tag: $NEW_TAG"
            echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          pattern: '*-AnyKernel3'

      - name: Package Timestamped AnyKernel3 Release ZIPs
        run: |
          set -e
          BUILD_STAMP=$(TZ="Asia/Kuwait" date +"%Y%m%d-%H%M")
          echo "=== Downloaded Artifacts Tree (Stamp: $BUILD_STAMP) ==="
          find ./downloaded-artifacts -maxdepth 3 || true

          if [ -f "./downloaded-artifacts/anykernel.sh" ]; then
            ARTIFACT_NAME=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name | endswith("-AnyKernel3"))][0].name' 2>/dev/null || echo "")
            if [ -z "$ARTIFACT_NAME" ]; then
              ARTIFACT_NAME="SM-S928B-Oneui8-android14_6.1-Normie-Kernel-bakasu-AnyKernel3"
            fi
            zip_out="$GITHUB_WORKSPACE/${ARTIFACT_NAME}-${BUILD_STAMP}.zip"
            echo "Packaging ./downloaded-artifacts -> $zip_out"
            (cd ./downloaded-artifacts && zip -r -9 "$zip_out" .)
          else
            mapfile -t AK3_DIRS < <(find ./downloaded-artifacts -mindepth 1 -maxdepth 2 -type d -name '*-AnyKernel3')
            if [ "${#AK3_DIRS[@]}" -eq 0 ]; then
              echo "ERROR: No AnyKernel3 files or *-AnyKernel3 directories found under ./downloaded-artifacts!"
              exit 1
            fi

            for dir in "${AK3_DIRS[@]}"; do
              artifact_name=$(basename "$dir")
              zip_out="$GITHUB_WORKSPACE/${artifact_name}-${BUILD_STAMP}.zip"
              echo "Packaging $dir -> $zip_out"
              if [ -d "$dir/AnyKernel3" ] && [ -f "$dir/AnyKernel3/anykernel.sh" ]; then
                (cd "$dir/AnyKernel3" && zip -r -9 "$zip_out" .)
              else
                (cd "$dir" && zip -r -9 "$zip_out" .)
              fi
            done
          fi

          ls -lh "$GITHUB_WORKSPACE"/*-AnyKernel3-*.zip

      - name: Build Normie-WALT-Battery v1.8 Module ZIP
        run: |
          python3 - << 'PYEOF'
          import os, pathlib, zipfile

          workspace = pathlib.Path(os.environ.get("GITHUB_WORKSPACE", "."))
          mod_zip = workspace / "Normie-WALT-Battery-v1.8.zip"

          files = {
              "module.prop": (
                  "id=normie_walt_battery\n"
                  "name=Normie WALT Battery Tuner\n"
                  "version=v1.8\n"
                  "versionCode=9\n"
                  "author=Andromodgod\n"
                  "description=Screen-aware 4-cluster WALT, UFS, Adreno GPU, THP madvise, VM, and wakelock tuning with KernelSU action.sh Battery/Stock toggle for SM-S928B.\n"
              ),
              "customize.sh": (
                  'ui_print "- Installing Normie WALT Battery Tuner v1.8"\n'
                  'ui_print "- Target: Snapdragon 8 Gen 3 (SM-S928B / e3q)"\n'
                  'set_perm "$MODPATH/service.sh" 0 0 0755\n'
                  'set_perm "$MODPATH/action.sh" 0 0 0755\n'
                  'ui_print "- Tip: Use the Action button in KernelSU Manager to toggle Battery/Stock profiles."\n'
              ),
              "action.sh": '''#!/system/bin/sh
          export PATH="/data/adb/ksu/bin:/system/bin:/system/xbin:/vendor/bin:$PATH"
          MODDIR=${0%/*}
          CONF="$MODDIR/mode.conf"
          LOG="$MODDIR/walt.log"

          CUR_MODE="battery"
          [ -r "$CONF" ] && read -r CUR_MODE < "$CONF"

          if [ "$CUR_MODE" = "battery" ]; then
              echo "stock" > "$CONF"
              echo "$(date '+%H:%M:%S') [action.sh] Switched mode to STOCK" >> "$LOG"
              echo "========================================="
              echo " Normie WALT Tuner -> STOCK PROFILE"
              echo " Restoring Samsung default WALT & GPU..."
              echo "========================================="
          else
              echo "battery" > "$CONF"
              echo "$(date '+%H:%M:%S') [action.sh] Switched mode to BATTERY" >> "$LOG"
              echo "========================================="
              echo " Normie WALT Tuner -> BATTERY PROFILE"
              echo " Activating 4-cluster WALT & deep sleep..."
              echo "========================================="
          fi
          ''',
              "service.sh": '''#!/system/bin/sh
          export PATH="/data/adb/ksu/bin:/system/bin:/system/xbin:/vendor/bin:$PATH"
          MODDIR=${0%/*}
          LOG="$MODDIR/walt.log"
          CONF="$MODDIR/mode.conf"

          until [ "$(getprop sys.boot_completed)" = "1" ]; do
              sleep 2
          done
          sleep 15

          [ -f "$CONF" ] || echo "battery" > "$CONF"
          echo "$(date '+%H:%M:%S') service.sh v1.8 started (PID $$)" > "$LOG"

          write_val() {
              if [ -e "$1" ]; then
                  chmod 644 "$1" 2>/dev/null
                  printf '%s\\n' "$2" > "$1" 2>/dev/null
              fi
          }

          pick_freq() {
              [ -r "$1" ] || return 1
              read -r f1 f2 f3 f4 f5 _ < "$1"
              case "$2" in
                  1) echo "$f1" ;;
                  2) echo "${f2:-$f1}" ;;
                  3) echo "${f3:-$f1}" ;;
                  4) echo "${f4:-$f1}" ;;
                  5) echo "${f5:-$f1}" ;;
                  *) echo "$f1" ;;
              esac
          }

          is_screen_on() {
              BL="/sys/class/backlight/panel0-backlight/bl_power"
              if [ -r "$BL" ]; then
                  read -r state < "$BL"
                  [ "$state" = "0" ] && return 0 || return 1
              fi
              case "$(dumpsys power 2>/dev/null | grep -m 1 'mWakefulness=')" in
                  *Awake*) return 0 ;;
                  *) return 1 ;;
              esac
          }

          apply_system_battery_tweaks() {
              for q in /sys/block/sd*/queue; do
                  [ -d "$q" ] || continue
                  write_val "$q/scheduler" "none"
                  write_val "$q/iostats" "0"
              done

              # Enforce THP=madvise (prevents Samsung boot scripts from leaving [always] active)
              write_val "/sys/kernel/mm/transparent_hugepage/enabled" "madvise"

              write_val "/proc/sys/vm/page-cluster" "0"
              write_val "/proc/sys/vm/swappiness" "100"
              write_val "/proc/sys/kernel/sched_util_clamp_min_rt_default" "384"
              write_val "/sys/class/kgsl/kgsl-3d0/idle_timer" "48"

              WL_NODE="/sys/class/misc/boeffla_wakelock_blocker/wakelock_blocker"
              [ -e "$WL_NODE" ] && write_val "$WL_NODE" "IPA_WS;qcom_rx_wakelock;wlan_rx_wake;hal_bluetooth_lock"
          }

          apply_stock_profile() {
              for policy in /sys/devices/system/cpu/cpufreq/policy*; do
                  [ -d "$policy/walt" ] || continue
                  write_val "$policy/walt/pl" "1"
                  write_val "$policy/walt/up_rate_limit_us" "500"
                  write_val "$policy/walt/down_rate_limit_us" "2000"
                  write_val "$policy/walt/hispeed_load" "80"
              done

              WALT_PROC="/proc/sys/walt"
              if [ -d "$WALT_PROC" ]; then
                  write_val "$WALT_PROC/sched_downmigrate" "85 85 85"
                  write_val "$WALT_PROC/sched_upmigrate" "95 95 95"
                  write_val "$WALT_PROC/sched_group_downmigrate" "85"
                  write_val "$WALT_PROC/sched_group_upmigrate" "100"
              fi

              write_val "/sys/kernel/mm/transparent_hugepage/enabled" "always"
              write_val "/proc/sys/vm/page-cluster" "3"
              write_val "/proc/sys/kernel/sched_util_clamp_min_rt_default" "1024"
              write_val "/sys/class/kgsl/kgsl-3d0/idle_timer" "80"
              WL_NODE="/sys/class/misc/boeffla_wakelock_blocker/wakelock_blocker"
              [ -e "$WL_NODE" ] && write_val "$WL_NODE" ""
          }

          apply_screen_on_profile() {
              for policy in /sys/devices/system/cpu/cpufreq/policy*; do
                  [ -d "$policy/walt" ] || continue
                  p_name=${policy##*/}
                  avail="$policy/scaling_available_frequencies"
                  write_val "$policy/walt/pl" "0"

                  case "$p_name" in
                      policy0)
                          write_val "$policy/walt/up_rate_limit_us" "1000"
                          write_val "$policy/walt/down_rate_limit_us" "1000"
                          write_val "$policy/walt/hispeed_load" "85"
                          hispeed=$(pick_freq "$avail" 5)
                          [ -n "$hispeed" ] && write_val "$policy/walt/hispeed_freq" "$hispeed"
                          ;;
                      policy2|policy5)
                          write_val "$policy/walt/up_rate_limit_us" "2500"
                          write_val "$policy/walt/down_rate_limit_us" "500"
                          write_val "$policy/walt/hispeed_load" "90"
                          hispeed=$(pick_freq "$avail" 4)
                          [ -n "$hispeed" ] && write_val "$policy/walt/hispeed_freq" "$hispeed"
                          ;;
                      policy7)
                          write_val "$policy/walt/up_rate_limit_us" "4000"
                          write_val "$policy/walt/down_rate_limit_us" "500"
                          write_val "$policy/walt/hispeed_load" "95"
                          hispeed=$(pick_freq "$avail" 2)
                          [ -n "$hispeed" ] && write_val "$policy/walt/hispeed_freq" "$hispeed"
                          ;;
                  esac
              done

              WALT_PROC="/proc/sys/walt"
              if [ -d "$WALT_PROC" ]; then
                  write_val "$WALT_PROC/sched_downmigrate" "70 78 86"
                  write_val "$WALT_PROC/sched_upmigrate" "85 90 96"
                  write_val "$WALT_PROC/sched_group_downmigrate" "80"
                  write_val "$WALT_PROC/sched_group_upmigrate" "95"
                  write_val "$WALT_PROC/sched_boost" "0"
              fi
              apply_system_battery_tweaks
          }

          apply_screen_off_profile() {
              for policy in /sys/devices/system/cpu/cpufreq/policy*; do
                  [ -d "$policy/walt" ] || continue
                  p_name=${policy##*/}
                  avail="$policy/scaling_available_frequencies"
                  min_freq=$(pick_freq "$avail" 1)

                  write_val "$policy/walt/pl" "0"
                  [ -n "$min_freq" ] && write_val "$policy/walt/hispeed_freq" "$min_freq"

                  case "$p_name" in
                      policy0)
                          write_val "$policy/walt/up_rate_limit_us" "2500"
                          write_val "$policy/walt/down_rate_limit_us" "500"
                          write_val "$policy/walt/hispeed_load" "95"
                          ;;
                      policy2|policy5)
                          write_val "$policy/walt/up_rate_limit_us" "6000"
                          write_val "$policy/walt/down_rate_limit_us" "500"
                          write_val "$policy/walt/hispeed_load" "98"
                          ;;
                      policy7)
                          write_val "$policy/walt/up_rate_limit_us" "10000"
                          write_val "$policy/walt/down_rate_limit_us" "500"
                          write_val "$policy/walt/hispeed_load" "99"
                          ;;
                  esac
              done

              WALT_PROC="/proc/sys/walt"
              if [ -d "$WALT_PROC" ]; then
                  write_val "$WALT_PROC/sched_upmigrate" "95 98 99"
                  write_val "$WALT_PROC/sched_downmigrate" "85 90 94"
                  write_val "$WALT_PROC/sched_group_upmigrate" "99"
                  write_val "$WALT_PROC/sched_group_downmigrate" "88"
                  write_val "$WALT_PROC/sched_boost" "0"
              fi
          }

          LAST_STATE=""
          while true; do
              MODE="battery"
              [ -r "$CONF" ] && read -r MODE < "$CONF"

              read -r u1 u2 u3 _ < /proc/sys/walt/sched_upmigrate 2>/dev/null
              CUR_UP="$u1 $u2 $u3"

              if [ "$MODE" = "stock" ]; then
                  if [ "$LAST_STATE" != "STOCK" ] || [ "$CUR_UP" != "95 95 95" ]; then
                      apply_stock_profile
                      if [ "$LAST_STATE" != "STOCK" ]; then
                          echo "$(date '+%H:%M:%S') Applied STOCK profile" >> "$LOG"
                          LAST_STATE="STOCK"
                      fi
                  fi
                  sleep 10
              else
                  if is_screen_on; then
                      if [ "$LAST_STATE" != "ON" ] || [ "$CUR_UP" != "85 90 96" ]; then
                          apply_screen_on_profile
                          if [ "$LAST_STATE" != "ON" ]; then
                              echo "$(date '+%H:%M:%S') Switched to SCREEN_ON profile" >> "$LOG"
                              LAST_STATE="ON"
                          fi
                      fi
                      sleep 10
                  else
                      if [ "$LAST_STATE" != "OFF" ] || [ "$CUR_UP" != "95 98 99" ]; then
                          apply_screen_off_profile
                          if [ "$LAST_STATE" != "OFF" ]; then
                              echo "$(date '+%H:%M:%S') Switched to SCREEN_OFF profile" >> "$LOG"
                              LAST_STATE="OFF"
                          fi
                      fi
                      sleep 25
                  fi
              fi
          done
          ''',
          }

          with zipfile.ZipFile(mod_zip, "w", zipfile.ZIP_DEFLATED) as zf:
              for name, raw in files.items():
                  lines = [ln[10:] if ln.startswith("          ") else ln for ln in raw.splitlines()]
                  content = ("\n".join(lines).lstrip("\n") + "\n").encode("utf-8")
                  info = zipfile.ZipInfo(name)
                  info.create_system = 3
                  info.external_attr = (0o755 if name.endswith(".sh") else 0o644) << 16
                  zf.writestr(info, content)

          print(f"Generated module zip -> {mod_zip}")
          PYEOF
          ls -lh "$GITHUB_WORKSPACE/Normie-WALT-Battery-v1.8.zip"

      - name: get commit hashes
        run: |
         echo "SUSFS_61=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android14-6.1 | cut -f1)" >> $GITHUB_ENV
         echo "BAKASU_HASH=$(git ls-remote https://github.com/Baka-SU/BakaSU.git refs/heads/main | cut -f1)" >> $GITHUB_ENV
         echo "BBG_HASH=$(git ls-remote https://github.com/vc-teahouse/Baseband-guard.git refs/heads/main | cut -f1)" >> $GITHUB_ENV
         echo "NM_HASH=$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/master | cut -f1)" >> $GITHUB_ENV

      - name: Set release body
        run: |
          cat << 'EOF' > release_body.md
          **IMPORTANT DISCLAIMER**
          This software is provided for testing and educational purposes only. Use at your own risk.
          The developers are not responsible for any damage, data loss, or issues that may occur.
          Please ensure you have proper backups before installation.

          Features:
          -> Supported ROMs - One UI 8, One UI 8.5 & One UI 9 (SM-S928B android14-6.1 GKI)
          EOF

          if [[ "${{ inputs.ksun }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          -> BakaSU - https://github.com/Baka-SU/BakaSU
          EOF
          fi

          if [[ "${{ inputs.susfs }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          -> SUSFS - https://gitlab.com/simonpunk/susfs4ksu
          -> SUSFS Inline hooks
          -> /proc/config.gz Stealth Masking (hides KSU, KPM, BBG, TMPFS_XATTR, WireGuard, BBR)
          EOF
          fi

          if [[ "${{ inputs.bbg }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          -> BBG - https://github.com/vc-teahouse/Baseband-guard
          EOF
          fi

          if [[ "${{ inputs.unicodefix }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          -> unicode fix - Prevent path traversal and other detections using non-printable Unicode codepoints
          EOF
          fi

          if [[ "${{ inputs.nomount }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          -> NoMount - https://github.com/maxsteeel/nomount
          EOF
          fi

          if [[ "${{ inputs.droidspace }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          -> droidspaces support - https://github.com/ravindu644/Droidspaces-OSS
          EOF
          fi

          if [[ "${{ inputs.ntsync }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          -> NTSync - High-performance, low-latency Windows NT synchronization primitives
          -> Built-in Gamepad Support (Xbox/xpad, PlayStation DualSense/DS4, Nintendo Switch Pro/Joy-Con, Steam Controller)
          -> USB Gadget HID & Mass Storage Support (USB Keyboard/Mouse & ISO mounting)
          EOF
          fi

          if [[ "${{ inputs.bbrv3 }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          -> TCP BBRv3 (Default) - Faster TCP congestion control active at boot
          -> CAKE & FQ qdisc Support (Default) - Low-latency packet scheduling
          -> Built-in WireGuard VPN Support
          EOF
          fi

          if [[ "${{ inputs.ipv6_nat }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          -> IP Set & IPv6 NAT Support - Advanced firewall capabilities and IPv6 NAT Support
          EOF
          fi

          if [[ "${{ inputs.ttl }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          -> TTL Target Support - Network packet manipulation
          EOF
          fi

          if [[ "${{ inputs.optimization }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          -> Battery & Deep Sleep Optimizations - 100Hz tickless idle timer, TEO cpuidle governor, Lazy RCU (RCU_LAZY active at boot), Power-Efficient Workqueues, Suspend Skip Sync, and 32ms PELT decay to prevent prime-core micro-boosts
          -> Scheduler & Wakelock Control - Lowered RT Task UClamp (384) to keep audio/sensor threads off the Cortex-X4 prime core, plus kernel-side Boeffla Wakelock Blocker (/sys/class/misc/boeffla_wakelock_blocker)
          -> Kernel Optimization - MGLRU active at boot, THP set to madvise (stops background khugepaged wakeups), ZRAM Multi-Comp (Zstd), and F2FS Zstd/LZ4 compression
          -> Companion Module Attached - Normie-WALT-Battery-v1.8.zip included in release assets (screen-aware 4-cluster WALT tuning, UFS/GPU idle optimization, and automatic wakelock filtering)
          EOF
          fi

          echo "-> Built using LTO: ${{ inputs.lto }}" >> release_body.md

          cat <<'EOF' >> release_body.md

          Commit Hashes:
          EOF
          if [[ "${{ inputs.ksun }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          BakaSU: ${{ env.BAKASU_HASH }}
          EOF
          fi
          if [[ "${{ inputs.susfs }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          SUSFS (android14-6.1): ${{ env.SUSFS_61 }}
          EOF
          fi
          if [[ "${{ inputs.bbg }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          BBG: ${{ env.BBG_HASH }}
          EOF
          fi
          if [[ "${{ inputs.nomount }}" == "true" ]]; then
          cat <<'EOF' >> release_body.md
          NoMount: ${{ env.NM_HASH }}
          EOF
          fi

      - name: Create GitHub Release & Attach Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: ${{ inputs.release_type == 'Pre-Release' }}
          files: |
            *-AnyKernel3-*.zip
            Normie-WALT-Battery-v1.8.zip
          fail_on_unmatched_files: true
          name: ${{ env.RELEASE_NAME }}
          body_path: release_body.md
