name: Kernel Config - Samsung

permissions:
  contents: write  # Allow writing to repository contents
  actions: write   # Allows triggering actions

on:
  workflow_call:
    inputs:
      oneui_targets:
        required: true
        type: string
      susfs:
        required: true
        type: string
      bbg:
        required: true
        type: string
      unicodefix:
        required: true
        type: string
      nomount:
        required: true
        type: string
      bakasu:
        required: true
        type: string
      droidspace:
        required: true
        type: string
      ntsync:
        required: true
        type: string
      bbrv3:
        required: true
        type: string
      cache:
        required: true
        type: string
      ipv6_nat:
        required: true
        type: string
      optimization:
        required: true
        type: string
      ttl:
        required: true
        type: string
      lto:
        required: true
        type: string

jobs:
  select-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix_include: ${{ steps.set_matrix.outputs.matrix_include }}
    steps:
      - name: Build target matrix from selection
        id: set_matrix
        run: |
          if [[ "${{ inputs.oneui_targets }}" == "all" ]]; then
            JSON='[{"branch":"SM-S928B-Oneui9","build_type":"Bazel"},{"branch":"SM-S928B-Oneui8.5","build_type":"Bazel"},{"branch":"SM-S928B-Oneui8","build_type":"Bazel"}]'
          else
            JSON="[{\"branch\":\"${{ inputs.oneui_targets }}\",\"build_type\":\"Bazel\"}]"
          fi
          echo "matrix_include=$JSON" >> "$GITHUB_OUTPUT"

  build-kernels-a12:
    needs: select-targets
    name: "Samsung-${{ matrix.branch }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.select-targets.outputs.matrix_include) }}

    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      branch: ${{ matrix.branch }}
      build_type: ${{ matrix.build_type }}
      susfs: ${{ inputs.susfs }}
      bbg: ${{ inputs.bbg }}
      unicodefix: ${{ inputs.unicodefix }}
      nomount: ${{ inputs.nomount }}
      bakasu: ${{ inputs.bakasu }}
      droidspace: ${{ inputs.droidspace }}
      ntsync: ${{ inputs.ntsync }}
      bbrv3: ${{ inputs.bbrv3 }}
      cache: ${{ inputs.cache }}
      ipv6_nat: ${{ inputs.ipv6_nat }}
      optimization: ${{ inputs.optimization }}
      ttl: ${{ inputs.ttl }}
      lto: ${{ inputs.lto }}
