name: Samsung Kernel Build

on:
  workflow_call:
    inputs:
      oneui_targets:
        required: false
        type: string
        default: all
      root_provider:
        required: true
        type: string
      susfs:
        required: true
        type: string
      kpm:
        required: false
        type: string
        default: "true"
      bbg:
        required: true
        type: string
      unicodefix:
        required: true
        type: string
      nomount:
        required: true
        type: string
      droidspace:
        required: true
        type: string
      ntsync:
        required: true
        type: string
      bbrv3:
        required: true
        type: string
      cache:
        required: true
        type: string
      ipv6_nat:
        required: true
        type: string
      optimization:
        required: true
        type: string
      ttl:
        required: true
        type: string
      lto:
        required: true
        type: string

jobs:
  build-kernels-a12:
    uses: ./.github/workflows/build.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: SM-S928B-Oneui9
            build_type: bazel
            sukisu_nova: true
            bakasu: false
            finasu: false
            root_provider: sukisu-nova
            target_group: SM-S928B-Oneui9

          - branch: SM-S928B-Oneui9
            build_type: bazel
            sukisu_nova: false
            bakasu: true
            finasu: false
            root_provider: bakasu
            target_group: SM-S928B-Oneui9

          - branch: SM-S928B-Oneui9
            build_type: bazel
            sukisu_nova: false
            bakasu: false
            finasu: true
            root_provider: finasu
            target_group: SM-S928B-Oneui9

          - branch: SM-S928B-Oneui9
            build_type: bazel
            sukisu_nova: false
            bakasu: false
            finasu: false
            root_provider: clean
            target_group: SM-S928B-Oneui9

          - branch: SM-S928B-Oneui8.5
            build_type: bazel
            sukisu_nova: true
            bakasu: false
            finasu: false
            root_provider: sukisu-nova
            target_group: SM-S928B-Oneui8.5

          - branch: SM-S928B-Oneui8.5
            build_type: bazel
            sukisu_nova: false
            bakasu: true
            finasu: false
            root_provider: bakasu
            target_group: SM-S928B-Oneui8.5

          - branch: SM-S928B-Oneui8.5
            build_type: bazel
            sukisu_nova: false
            bakasu: false
            finasu: true
            root_provider: finasu
            target_group: SM-S928B-Oneui8.5

          - branch: SM-S928B-Oneui8.5
            build_type: bazel
            sukisu_nova: false
            bakasu: false
            finasu: false
            root_provider: clean
            target_group: SM-S928B-Oneui8.5

          - branch: SM-S928B-Oneui8
            build_type: bazel
            sukisu_nova: true
            bakasu: false
            finasu: false
            root_provider: sukisu-nova
            target_group: SM-S928B-Oneui8

          - branch: SM-S928B-Oneui8
            build_type: bazel
            sukisu_nova: false
            bakasu: true
            finasu: false
            root_provider: bakasu
            target_group: SM-S928B-Oneui8

          - branch: SM-S928B-Oneui8
            build_type: bazel
            sukisu_nova: false
            bakasu: false
            finasu: true
            root_provider: finasu
            target_group: SM-S928B-Oneui8

          - branch: SM-S928B-Oneui8
            build_type: bazel
            sukisu_nova: false
            bakasu: false
            finasu: false
            root_provider: clean
            target_group: SM-S928B-Oneui8

    if: >-
      (
        inputs.oneui_targets == '' ||
        inputs.oneui_targets == 'all' ||
        matrix.target_group == inputs.oneui_targets
      ) &&
      (
        inputs.root_provider == 'both' ||
        matrix.root_provider == inputs.root_provider
      )
    secrets: inherit
    with:
      branch: ${{ matrix.branch }}
      build_type: ${{ matrix.build_type }}
      root_provider: ${{ matrix.root_provider }}
      susfs: ${{ inputs.susfs }}
      kpm: ${{ inputs.kpm }}
      bbg: ${{ inputs.bbg }}
      unicodefix: ${{ inputs.unicodefix }}
      nomount: ${{ inputs.nomount }}
      sukisu_nova: ${{ matrix.sukisu_nova }}
      bakasu: ${{ matrix.bakasu }}
      finasu: ${{ matrix.finasu }}
      droidspace: ${{ inputs.droidspace }}
      ntsync: ${{ inputs.ntsync }}
      bbrv3: ${{ inputs.bbrv3 }}
      cache: ${{ inputs.cache }}
      ipv6_nat: ${{ inputs.ipv6_nat }}
      optimization: ${{ inputs.optimization }}
      ttl: ${{ inputs.ttl }}
      lto: ${{ inputs.lto }}
