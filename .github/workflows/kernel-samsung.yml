name: Kernel Config - Samsung

permissions:
  contents: write  # Allow writing to repository contents
  actions: write   # Allows triggering actions

on:
  workflow_call:
    inputs:
      oneui_targets:
        required: true
        type: string
      root_provider:
        required: false
        type: string
        default: both
      susfs:
        required: true
        type: string
      bbg:
        required: true
        type: string
      unicodefix:
        required: true
        type: string
      nomount:
        required: true
        type: string
      bakasu:
        required: false
        type: string
        default: "true"
      droidspace:
        required: true
        type: string
      ntsync:
        required: true
        type: string
      bbrv3:
        required: true
        type: string
      cache:
        required: true
        type: string
      ipv6_nat:
        required: true
        type: string
      optimization:
        required: true
        type: string
      ttl:
        required: true
        type: string
      lto:
        required: true
        type: string

jobs:
  select-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix_include: ${{ steps.set_matrix.outputs.matrix_include }}
    steps:
      - name: Build target matrix from selection
        id: set_matrix
        run: |
          python3 - << 'PYEOF'
          import json, os

          target_in = "${{ inputs.oneui_targets }}"
          root_in = "${{ inputs.root_provider }}" or ("bakasu" if "${{ inputs.bakasu }}" == "true" else "clean")

          if target_in == "all":
              branches = ["SM-S928B-Oneui9", "SM-S928B-Oneui8.5", "SM-S928B-Oneui8"]
          else:
              branches = [target_in]

          if root_in == "both":
              roots = ["bakasu", "finasu"]
          elif root_in in ("bakasu", "finasu", "clean"):
              roots = [root_in]
          else:
              roots = ["bakasu"]

          matrix_include = [
              {
                  "branch": branch,
                  "build_type": "Bazel",
                  "root_provider": root,
                  "bakasu": "true" if root == "bakasu" else "false",
                  "finasu": "true" if root == "finasu" else "false",
              }
              for branch in branches
              for root in roots
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix_include=" + json.dumps(matrix_include) + "\n")
          PYEOF

  build-kernels-a12:
    needs: select-targets
    name: "Samsung-${{ matrix.branch }}-${{ matrix.root_provider }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.select-targets.outputs.matrix_include) }}

    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      branch: ${{ matrix.branch }}
      build_type: ${{ matrix.build_type }}
      root_provider: ${{ matrix.root_provider }}
      bakasu: ${{ matrix.bakasu }}
      finasu: ${{ matrix.finasu }}
      susfs: ${{ inputs.susfs }}
      bbg: ${{ inputs.bbg }}
      unicodefix: ${{ inputs.unicodefix }}
      nomount: ${{ inputs.nomount }}
      droidspace: ${{ inputs.droidspace }}
      ntsync: ${{ inputs.ntsync }}
      bbrv3: ${{ inputs.bbrv3 }}
      cache: ${{ inputs.cache }}
      ipv6_nat: ${{ inputs.ipv6_nat }}
      optimization: ${{ inputs.optimization }}
      ttl: ${{ inputs.ttl }}
      lto: ${{ inputs.lto }}
