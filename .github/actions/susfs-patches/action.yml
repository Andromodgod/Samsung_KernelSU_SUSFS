name: apply susfs patches
description: apply susfs patches
inputs:
  nomount:
    description: 'nomount'
    required: true

runs:
  using: composite
  steps:
    - name: clone susfs
      shell: bash
      run: |
        SUSFS_BRANCH="gki-$ANDROID_VER-$KERNEL_VER"
        git clone --depth 1 -b "$SUSFS_BRANCH" --single-branch https://gitlab.com/simonpunk/susfs4ksu.git

        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"

        cd susfs4ksu
        git fetch https://gitlab.com/pershoot/susfs4ksu.git gki-android14-6.1-dev
        git log ..FETCH_HEAD --oneline -n 2 | awk '{print $1}' | tac | xargs git cherry-pick

        #cd susfs4ksu
        #if [[ "$ANDROID_VER-$KERNEL_VER" == "android12-5.10" ]]; then
          #COMMIT=ce2c2b2dea28c89d33f61af898cc18a93bf65ae9
        #elif [[ "$ANDROID_VER-$KERNEL_VER" == "android13-5.15" ]]; then
         # COMMIT=529919fbc9f8aee6ee70eb3a8890ef33af0a109c
        #elif [[ "$ANDROID_VER-$KERNEL_VER" == "android14-6.1" ]]; then
          #COMMIT=d1327b62e0854603cfc26e2226e0a993ec9b0656
        #elif [[ "$ANDROID_VER-$KERNEL_VER" == "android15-6.6" ]]; then
          #COMMIT=676d202ed2cc322a2f90bcb2b56bc4f6a864acb8
        #fi
        #git checkout "$COMMIT"

        SUSFS4KSU="$ROOT/susfs4ksu"
        echo "SUSFS4KSU=$SUSFS4KSU" >> $GITHUB_ENV

    - name: Copy required files
      shell: bash
      run: |
        # Apply SUSFS to kernel
        cd "$COMMON"
        cp "$SUSFS4KSU/kernel_patches/fs/"* ./fs/
        cp "$SUSFS4KSU/kernel_patches/include/linux/"* ./include/linux/
        cp "$SUSFS4KSU/kernel_patches/50_add_susfs_in_gki-$ANDROID_VER-$KERNEL_VER.patch" ./

    - name: prepare open.c for susfs patch
      shell: bash
      run: |
        cd "$COMMON"
        #Prepare open.c for susfs patching
        sed -i '/#ifdef CONFIG_SECURITY_DEFEX/,/^#endif/d' fs/open.c

    - name: prepare namei.c for susfs patch
      if: env.BRANCH == 'SM-S928B-Oneui9'
      shell: bash
      run: |
        cd "$COMMON"
        #Prepare namei.c for susfs patching
        # Delete security defex blocks
        sed -i '/#ifdef CONFIG_SECURITY_DEFEX/,/^#endif/d' fs/namei.c

        # 2. Cleanup command: Find the empty while loop body and replace it with a semicolon
        sed -i '/while (!(error = link_path_walk/,/^[[:space:]]*}[[:space:]]*$/{
        s/) {$/)/
        /^[[:space:]]*}[[:space:]]*$/c\
        \t\t\t;
        }' fs/namei.c

    - name: prepare namespace.c for susfs patching
      shell: bash
      run: |
        cd "$COMMON"
        #fake patch trace/hooks/blk.h for susfs patching for kernel 6.1 and 5.15
        if [[ $KERNEL_VER == 6.1 || $KERNEL_VER == 5.15 ]]; then
          sed -i '/#include "internal.h"/a #include <trace/hooks/blk.h>' fs/namespace.c
        fi

        #move fslog.h for susfs patch for LOS
        if [[ $BRANCH == *LOS* ]]; then
         sed -i '/#include <linux\/fslog.h>/d; /#include <linux\/security.h>/a #include <linux/fslog.h>' fs/namespace.c
         sed -i '/#include <linux\/cn_proc.h>/d; /#include <linux\/slab.h>/a #include <linux/cn_proc.h>' fs/proc/base.c
        fi

        #remove kdp_ns section for susfs patch
        sed -i '/copy_flags = CL_COPY_UNBINDABLE | CL_EXPIRE;/,/#endif/ {
         /#ifdef CONFIG_KDP_NS/,/#endif/ {
            /#else/,/#endif/!d
            /#else/d
            /#endif/d
         }
        }' fs/namespace.c

    - name: apply susfs patch and fix if necessary
      shell: bash
      run: |
        cd "$COMMON"
        # Apply SUSFS core patch
        patch -p1 < 50_add_susfs_in_gki-$ANDROID_VER-$KERNEL_VER.patch || true
        rm -rf 50_add_susfs_in_gki-$ANDROID_VER-$KERNEL_VER.patch

        shopt -s nullglob
        patches=("$KERNEL_PATCHES/samsung/$BRANCH"/*.patch)

        if [ ${#patches[@]} -gt 0 ]; then
         echo "Patches found, applying..."
         cp "${patches[@]}" ./

         # Fix SUSFS rejects
          for p in *.patch; do
            patch -p1 < "$p"
            rm -f "$p"
          done
          shopt -u nullglob
        else
          echo "No patch file found, skipping"
        fi

        # SUSFS's OPEN_REDIRECT code unconditionally calls VMA_PAD_START(), which
        # only exists on GKI branches that carry Google's page-size-migration
        # feature (added to each android version's kernel/common branch at a
        # different, sometime later, os_patch_level). Older os_patch_levels in
        # our build matrix predate it, so fall back to a no-padding definition
        # when the real header/macro isn't present. This is version-agnostic and
        # a no-op wherever the real header already provides it.
        if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
          sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
          echo "Added VMA_PAD_START fallback definition to fs/proc/task_mmu.c"
        fi

        # Same story for __fold_filemap_fixup_entry(), declared in page_size_compat.h.
        if grep -q '__fold_filemap_fixup_entry' fs/proc/task_mmu.c && ! grep -q '#include <linux/page_size_compat.h>' fs/proc/task_mmu.c; then
          sed -i '/#include <linux\/pkeys.h>/a #include <linux/page_size_compat.h>' fs/proc/task_mmu.c
          echo "Added page_size_compat.h include to fs/proc/task_mmu.c"
        fi

    - name: Apply SELinux ksu/lsposed context hide patch
      shell: bash
      run: |
        cd "$COMMON"
        python3 - << 'PYEOF'
        from pathlib import Path

        def insert_once(path_str: str, anchor: str, block: str, label: str) -> None:
            p = Path(path_str)
            src = p.read_text(encoding="utf-8", errors="ignore")
            if block.strip() in src:
                print(f"[skip] {label} already present in {path_str}")
                return
            idx = src.find(anchor)
            if idx == -1:
                raise RuntimeError(f"Anchor not found in {path_str} for {label}")
            p.write_text(src[:idx] + block + src[idx:], encoding="utf-8", newline="\n")
            print(f"[ok] Applied {label} to {path_str}")

        # 1. sel_write_context: return -EINVAL for unprivileged UIDs querying :ksu or :lsposed
        insert_once(
            "security/selinux/selinuxfs.c",
            "\tlength = security_context_to_sid(fsi->state, page, count, &sid,",
            """#ifdef CONFIG_KSU_SUSFS
        \tif (current_uid().val >= 10000 &&
        \t    (strstr(page, ":ksu") || strstr(page, ":lsposed"))) {
        \t\tlength = -EINVAL;
        \t\tgoto out;
        \t}
        #endif
        """,
            "sel_write_context hide",
        )

        # 2. sel_write_access: reject :ksu / :lsposed contexts for unprivileged UIDs
        insert_once(
            "security/selinux/selinuxfs.c",
            "\tlength = security_context_to_sid(fsi->state, scon, strlen(scon) + 1,",
            """#ifdef CONFIG_KSU_SUSFS
        \tif (current_uid().val >= 10000 &&
        \t    (strstr(scon, ":ksu") || strstr(tcon, ":ksu") ||
        \t     strstr(scon, ":lsposed") || strstr(tcon, ":lsposed"))) {
        \t\tgoto out;
        \t}
        #endif
        """,
            "sel_write_access context hide",
        )

        # 3. sel_write_access: mask PROCESS__EXECMEM on system_server self-query for app UIDs
        insert_once(
            "security/selinux/selinuxfs.c",
            "\tlength = scnprintf(buf, SIMPLE_TRANSACTION_LIMIT,",
            """#ifdef CONFIG_KSU_SUSFS
        \tif (current_uid().val >= 10000 &&
        \t    strcmp(scon, "u:r:system_server:s0") == 0 &&
        \t    strcmp(tcon, "u:r:system_server:s0") == 0) {
        \t\tavd.allowed &= ~PROCESS__EXECMEM;
        \t}
        #endif
        """,
            "sel_write_access execmem mask",
        )

        # 4. selinux_setprocattr: reject :ksu / :lsposed on /proc/self/attr/current for app UIDs
        insert_once(
            "security/selinux/hooks.c",
            "\t/* Obtain a SID for the context, if one was specified. */",
            """#ifdef CONFIG_KSU_SUSFS
        \tif (current_uid().val >= 10000 && value &&
        \t    (strnstr(value, ":ksu", size) ||
        \t     strnstr(value, ":lsposed", size))) {
        \t\treturn -EINVAL;
        \t}
        #endif
        """,
            "selinux_setprocattr hide",
        )
        PYEOF

    - name: undo namespace.c fake patch since trace/hooks/blk.h doesn't exist in kernel
      shell: bash
      run: |
        cd "$COMMON"
        if [[ $KERNEL_VER == 6.1 || $KERNEL_VER == 5.15 ]]; then
         sed -i '/#include <trace\/hooks\/blk.h>/d' fs/namespace.c
        fi

    - name: add ksu-susfs to config
      shell: bash
      run: |
        "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU_SUSFS
