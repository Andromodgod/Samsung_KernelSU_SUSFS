name: Kernel Build Process
permissions:
  contents: read
  actions: write

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      build_type:
        required: false
        type: string
      root_provider:
        required: false
        type: string
        default: bakasu
      susfs:
        required: true
        type: string
      bbg:
        required: true
        type: string
      unicodefix:
        required: true
        type: string
      nomount:
        required: true
        type: string
      sukisu_nova:
        required: false
        type: string
        default: "false"
      bakasu:
        required: true
        type: string
      finasu:
        required: false
        type: string
        default: "false"
      droidspace:
        required: true
        type: string
      ntsync:
        required: true
        type: string
      bbrv3:
        required: true
        type: string
      cache:
        required: true
        type: string
      ipv6_nat:
        required: true
        type: string
      optimization:
        required: true
        type: string
      ttl:
        required: true
        type: string
      lto:
        required: true
        type: string

jobs:
  build-samsung-gki:
    name: "${{ inputs.branch }} (${{ inputs.root_provider }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Store branch and root_provider as env variables
        run: |
          BRANCH=${{ inputs.branch }}
          ROOT_PROVIDER=${{ inputs.root_provider }}
          if [ -z "$ROOT_PROVIDER" ]; then
            if [[ "${{ inputs.sukisu_nova }}" == "true" ]]; then
              ROOT_PROVIDER="sukisu-nova"
            elif [[ "${{ inputs.finasu }}" == "true" ]]; then
              ROOT_PROVIDER="finasu"
            elif [[ "${{ inputs.bakasu }}" == "true" ]]; then
              ROOT_PROVIDER="bakasu"
            else
              ROOT_PROVIDER="clean"
            fi
          fi
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "ROOT_PROVIDER=$ROOT_PROVIDER" >> $GITHUB_ENV

      - name: get kernel version before cloning
        uses: ./.github/actions/kernel-info

      - name: Store LTO as env variable
        run: |
          if [[ $KERNEL_VER != 6.6 ]]; then
            BUILD_LTO=${{ inputs.lto }} && echo "BUILD_LTO=$BUILD_LTO" >> $GITHUB_ENV
          else
            BUILD_LTO="default" && echo "BUILD_LTO=$BUILD_LTO" >> $GITHUB_ENV
          fi

      - name: Free Disk Space
        if: true
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Setup more Swap (for LTO)
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 25

      - name: Parse branch for cache keys
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        uses: ./.github/actions/parse-branch

      - name: Install ccache
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Export ccache + determinism
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        run: |
          CACHE_DIR="${{ github.workspace }}/.ccache"
          mkdir -p "$CACHE_DIR"
          CCACHE_LOG="${{ github.workspace }}/ccache.log"

          SETTINGS=(
          "CCACHE_DIR=$CACHE_DIR"
          "CCACHE_MAXSIZE=12G"
          "CCACHE_COMPILERCHECK=content"
          "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
          "CCACHE_NOHASHDIR=true"
          "CCACHE_IGNOREOPTIONS=-sysroot* -fdebug-prefix-map=* -fmacro-prefix-map=*"
          "CCACHE_COMPRESS=true"
          "CCACHE_COMPRESSLEVEL=8"
          "CCACHE_DIRECT=true"
          "CCACHE_FILE_CLONE=true"
          "CCACHE_INODE_CACHE=true"
          "CCACHE_IS_KERNEL_COMPILING=true"
          "CCACHE_UMASK=002"
          "KBUILD_BUILD_TIMESTAMP=2026-01-01"
          "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale,file_stat_matches"
          )

          for setting in "${SETTINGS[@]}"; do
            export "$setting"
            echo "$setting" >> $GITHUB_ENV
          done

          if ccache --help 2>&1 | grep -q 'depend_mode'; then
            export CCACHE_DEPEND=true
            echo "CCACHE_DEPEND=true" >> $GITHUB_ENV
          fi

      - name: restore ccache
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ inputs.build_type }}-${{ env.BASE_BRANCH }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.build_type }}-${{ env.BASE_BRANCH }}
            ccache-${{ runner.os }}-${{ inputs.build_type }}-

      - name: Ensure ccache is used
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          echo "CC='ccache clang'" >> $GITHUB_ENV
          echo "CXX='ccache clang++'" >> $GITHUB_ENV

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="${BRANCH}-${ANDROID_VER}_${KERNEL_VER}"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

      - name: dependencies
        uses: ./.github/actions/dependencies

      - name: Download Kernel
        uses: ./.github/actions/clone-kernel

      - name: Set Path Environment Variables
        uses: ./.github/actions/env-variables

      - name: Extract all tar.xz files and delete them
        run: |
          cd "$CONFIG"

          find . -type f -name '*.tar.xz' -print0 | while IFS= read -r -d '' file; do
            echo "Extracting $file"
            tar -xf "$file"
            rm "$file"
          done

      - name: Add SukiSU-Nova
        if: inputs.sukisu_nova == 'true' || env.ROOT_PROVIDER == 'sukisu-nova'
        timeout-minutes: 5
        env:
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "never"
        run: |
          set -euo pipefail
          KERNEL_ROOT="${COMMON:-$GITHUB_WORKSPACE/$CONFIG/kernel_platform/common}"
          echo "KERNEL_ROOT=$KERNEL_ROOT" >> $GITHUB_ENV

          mkdir -p "$KERNEL_ROOT"
          cd "$KERNEL_ROOT"
          rm -rf drivers/kernelsu KernelSU BakaSU FinaSU SukiSU-Nova "$GITHUB_WORKSPACE/SukiSU-Nova"
          git -c core.askPass=true clone --depth=1 --single-branch https://github.com/SukiSU-Nova/SukiSU-Nova.git "$GITHUB_WORKSPACE/SukiSU-Nova"

          mkdir -p drivers/kernelsu
          if [ -d "$GITHUB_WORKSPACE/SukiSU-Nova/kernel" ]; then
            cp -a "$GITHUB_WORKSPACE/SukiSU-Nova/kernel/." "drivers/kernelsu/"
          else
            cp -a "$GITHUB_WORKSPACE/SukiSU-Nova/." "drivers/kernelsu/"
          fi

          if [ -L "drivers/kernelsu" ]; then
            TARGET=$(readlink -f "drivers/kernelsu")
            rm -f "drivers/kernelsu"
            cp -a "$TARGET" "drivers/kernelsu"
          fi
          echo "Materialized SukiSU-Nova drivers/kernelsu"

          if [ -f "drivers/Makefile" ] && ! grep -q "kernelsu" "drivers/Makefile"; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> "drivers/Makefile"
          fi
          if [ -f "drivers/Kconfig" ] && ! grep -q "drivers/kernelsu/Kconfig" "drivers/Kconfig"; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "drivers/Kconfig"
          fi

      - name: Add BakaSU
        if: inputs.bakasu == 'true' && inputs.finasu != 'true' && inputs.sukisu_nova != 'true' && env.ROOT_PROVIDER != 'sukisu-nova'
        run: |
          set -euo pipefail
          KERNEL_ROOT="${COMMON:-$GITHUB_WORKSPACE/$CONFIG/kernel_platform/common}"
          echo "KERNEL_ROOT=$KERNEL_ROOT" >> $GITHUB_ENV

          cd "$KERNEL_ROOT"
          rm -rf drivers/kernelsu KernelSU BakaSU FinaSU SukiSU-Nova
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

          TARGET_KSU_VER=35282

          for repo in "$KERNEL_ROOT/BakaSU" "$KERNEL_ROOT/KernelSU" "drivers/kernelsu"; do
            if [ -d "$repo/.git" ] && [ -f "$repo/.git/shallow" ]; then
              git -C "$repo" fetch --unshallow 2>/dev/null || true
            fi
          done

          if [ -L "drivers/kernelsu" ]; then
            TARGET=$(readlink -f "drivers/kernelsu")
            rm -f "drivers/kernelsu"
            cp -r "$TARGET" "drivers/kernelsu"
            echo "Materialized drivers/kernelsu from $TARGET"
          fi

          for mk_file in \
            "$KERNEL_ROOT/drivers/kernelsu/tools/static_export_check.mk" \
            "$KERNEL_ROOT/KernelSU/kernel/tools/static_export_check.mk" \
            "$KERNEL_ROOT/BakaSU/kernel/tools/static_export_check.mk"; do
            if [ -f "$mk_file" ]; then
              sed -i -E 's/\$\(error\b/\$(warning/g' "$mk_file"
              echo "Neutralized $(error in $mk_file"
            fi
          done

          for KBUILD_FILE in \
            "$KERNEL_ROOT/drivers/kernelsu/Kbuild" \
            "$KERNEL_ROOT/KernelSU/kernel/Kbuild" \
            "$KERNEL_ROOT/BakaSU/kernel/Kbuild"; do
            if [ -f "$KBUILD_FILE" ]; then
              sed -i -E 's/\$\(error\b/\$(warning/g' "$KBUILD_FILE"
              sed -i -E "s|^[[:space:]]*KSU_SRC[[:space:]]*[:?]?=.*|KSU_SRC := \$(srctree)/drivers/kernelsu|g" "$KBUILD_FILE"
              grep -q "KSU_SRC :=" "$KBUILD_FILE" || sed -i "1i KSU_SRC := \$(srctree)/drivers/kernelsu" "$KBUILD_FILE"
              sed -i '/You should use BakaSU as a git submodule/d' "$KBUILD_FILE"
              sed -i -E "s|^(KSU_LOCAL_VERSION[[:space:]]*[:?]?=).*|\1 $TARGET_KSU_VER|g" "$KBUILD_FILE"
              sed -i -E "s|^(KSU_VERSION[[:space:]]*[:?]?=).*|\1 $TARGET_KSU_VER|g" "$KBUILD_FILE"
              echo "Patched Kbuild in $KBUILD_FILE:"
              grep -n -E "KSU_SRC|KSU_LOCAL_VERSION|KSU_VERSION" "$KBUILD_FILE" || true
            fi
          done

      - name: Add FinaSU
        if: inputs.finasu == 'true'
        env:
          FINASU_REF: ${{ vars.FINASU_REF }}
          GH_TOKEN: ${{ github.token }}
        run: |
          KERNEL_ROOT="${COMMON:-$GITHUB_WORKSPACE/$CONFIG/kernel_platform/common}"
          echo "KERNEL_ROOT=$KERNEL_ROOT" >> $GITHUB_ENV

          cd "$KERNEL_ROOT"
          rm -rf drivers/kernelsu KernelSU BakaSU FinaSU SukiSU-Nova "$GITHUB_WORKSPACE/FinaSU"
          REF="${FINASU_REF:-}"
          if [ -z "$REF" ]; then
            REF=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/LyraVoid/FinaSU/releases/latest" | jq -r '.tag_name // empty' || true)
          fi
          if [ -n "$REF" ]; then
            echo "Cloning FinaSU at $REF"
            git clone --depth=1 --branch "$REF" https://github.com/LyraVoid/FinaSU.git "$GITHUB_WORKSPACE/FinaSU"
          else
            echo "::warning::Could not resolve a FinaSU release tag; cloning default branch"
            git clone --depth=1 https://github.com/LyraVoid/FinaSU.git "$GITHUB_WORKSPACE/FinaSU"
          fi

          if [ -f "$GITHUB_WORKSPACE/FinaSU/kernel/setup.sh" ]; then
            bash "$GITHUB_WORKSPACE/FinaSU/kernel/setup.sh" --dir "$GITHUB_WORKSPACE/FinaSU"
          elif [ -f "$GITHUB_WORKSPACE/FinaSU/setup.sh" ]; then
            bash "$GITHUB_WORKSPACE/FinaSU/setup.sh"
          else
            mkdir -p drivers/kernelsu
            if [ -d "$GITHUB_WORKSPACE/FinaSU/kernel" ]; then
              cp -a "$GITHUB_WORKSPACE/FinaSU/kernel/." "drivers/kernelsu/"
            else
              cp -a "$GITHUB_WORKSPACE/FinaSU/." "drivers/kernelsu/"
            fi
          fi

          if [ -d "$GITHUB_WORKSPACE/FinaSU/.git" ] && [ -f "$GITHUB_WORKSPACE/FinaSU/.git/shallow" ]; then
            git -C "$GITHUB_WORKSPACE/FinaSU" fetch --unshallow 2>/dev/null || true
          fi

          if [ -L "drivers/kernelsu" ]; then
            TARGET=$(readlink -f "drivers/kernelsu")
            rm -f "drivers/kernelsu"
            cp -a "$TARGET" "drivers/kernelsu"
            echo "Materialized FinaSU drivers/kernelsu from $TARGET"
          elif [ -d "drivers/kernelsu" ]; then
            cp -a "$GITHUB_WORKSPACE/FinaSU/kernel/." "drivers/kernelsu/" 2>/dev/null || true
          fi

          if [ -f "drivers/Makefile" ] && ! grep -q "kernelsu" "drivers/Makefile"; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> "drivers/Makefile"
          fi
          if [ -f "drivers/Kconfig" ] && ! grep -q "drivers/kernelsu/Kconfig" "drivers/Kconfig"; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "drivers/Kconfig"
          fi

      - name: Fix FinaSU version and manager signature
        if: inputs.finasu == 'true'
        env:
          FINASU_REF: ${{ vars.FINASU_REF }}
          GH_TOKEN: ${{ github.token }}
          SIG_SIZE_OVERRIDE: ${{ vars.FINASU_SIG_SIZE }}
          SIG_HASH_OVERRIDE: ${{ vars.FINASU_SIG_HASH }}
        run: |
          set -euo pipefail
          KERNEL_ROOT="${KERNEL_ROOT:-${COMMON:-$GITHUB_WORKSPACE/$CONFIG/kernel_platform/common}}"
          KB="$KERNEL_ROOT/drivers/kernelsu/Kbuild"
          R="$GITHUB_WORKSPACE/FinaSU"
          [ -f "$KB" ] || { echo "::error::$KB not found"; exit 1; }

          if [ -f "$R/.git/shallow" ]; then git -C "$R" fetch --unshallow --tags 2>/dev/null || true; fi
          COUNT=$(git -C "$R" rev-list --count HEAD)
          SHA=$(git -C "$R" rev-parse --short=8 HEAD)
          TAG=$(git -C "$R" describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          FINASU_BRANCH=$(git -C "$R" rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)
          VER=$((30000 + COUNT))
          sed -i -E "s/-DKSU_VERSION=16/-DKSU_VERSION=${VER}/" "$KB"
          sed -i -E "s|^KSU_VERSION_FULL := v0\.0\.0-00000000@unknown|KSU_VERSION_FULL := v${TAG:-unknown}-${SHA}@${FINASU_BRANCH}|" "$KB"
          echo "FinaSU version set to ${VER} (v${TAG:-unknown}-${SHA}@${FINASU_BRANCH})"

          if [ -n "${SIG_SIZE_OVERRIDE:-}" ] && [ -n "${SIG_HASH_OVERRIDE:-}" ]; then
            SIG_SIZE="$SIG_SIZE_OVERRIDE"; SIG_HASH="$SIG_HASH_OVERRIDE"
            echo "Using manager signature from repository variables"
          else
            api() { curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$1"; }
            REL=""
            if [ -n "${FINASU_REF:-}" ]; then REL=$(api "https://api.github.com/repos/LyraVoid/FinaSU/releases/tags/${FINASU_REF}" 2>/dev/null || true); fi
            if [ -z "$REL" ] || ! printf '%s\n' "$REL" | jq -e '.assets' >/dev/null 2>&1; then
              REL=$(api "https://api.github.com/repos/LyraVoid/FinaSU/releases/latest")
            fi
            APK_URL=$(python3 -c '
          import json, re, sys

          data = json.load(sys.stdin)
          assets = data.get("assets") or []
          apks = [a.get("browser_download_url", "") for a in assets if isinstance(a, dict) and str(a.get("name", "")).endswith(".apk")]

          def score(url):
              name = url.rsplit("/", 1)[-1].lower()
              is_arm64 = bool(re.search(r"arm64|aarch64", name))
              has_other_arch = bool(re.search(r"armeabi|v7a|x86|riscv", name))
              if not (is_arm64 or not has_other_arch):
                  return None
              is_release = 1 if "release" in name else 0
              return (is_release, 1 if is_arm64 else 0)

          ranked = []
          for u in apks:
              s = score(u)
              if s is not None and u:
                  ranked.append((s, u))

          ranked.sort(key=lambda item: item[0], reverse=True)
          print(ranked[0][1] if ranked else "")
          ' <<< "$REL")
            [ -n "$APK_URL" ] || { echo "::error::No arm64 FinaSU manager APK found in the release; set FINASU_SIG_SIZE and FINASU_SIG_HASH repo variables"; exit 1; }
            echo "Reading manager signature from $APK_URL"
            curl -fsSL -o "$RUNNER_TEMP/finasu-manager.apk" "$APK_URL"
            cat > "$RUNNER_TEMP/apk_cert.py" << 'PYEOF'
          import hashlib, struct, sys

          def u32(b, o): return struct.unpack_from("<I", b, o)[0]
          def u64(b, o): return struct.unpack_from("<Q", b, o)[0]

          def signing_block(d):
              i = d.rfind(b"PK\x05\x06")
              if i < 0: raise SystemExit("no EOCD")
              cd_off = u32(d, i + 16)
              if d[cd_off - 16:cd_off] != b"APK Sig Block 42": raise SystemExit("no APK signing block (v1-only APK?)")
              size = u64(d, cd_off - 24)
              return d[cd_off - size - 8: cd_off - 24]

          def pairs(blk):
              o = 8
              while o + 12 <= len(blk):
                  n = u64(blk, o); pid = u32(blk, o + 8)
                  yield pid, blk[o + 12: o + 8 + n]
                  o += 8 + n

          def lp(b, o):
              n = u32(b, o); return b[o + 4:o + 4 + n], o + 4 + n

          d = open(sys.argv[1], "rb").read()
          certs = []
          for pid, val in pairs(signing_block(d)):
              if pid not in (0x7109871a, 0xf05368c0): continue
              signers, _ = lp(val, 0); o = 0
              while o < len(signers):
                  signer, o = lp(signers, o)
                  signed, _ = lp(signer, 0)
                  _digests, p = lp(signed, 0)
                  cert_seq, _ = lp(signed, p)
                  c = 0
                  while c < len(cert_seq):
                      cert, c = lp(cert_seq, c)
                      certs.append(cert)
          if not certs: raise SystemExit("no certificates found")
          cert = certs[0]
          print(f"0x{len(cert):04x} {hashlib.sha256(cert).hexdigest()}")
          PYEOF
            read -r SIG_SIZE SIG_HASH < <(python3 "$RUNNER_TEMP/apk_cert.py" "$RUNNER_TEMP/finasu-manager.apk")
          fi
          [[ "$SIG_SIZE" =~ ^0x[0-9a-fA-F]+$ ]] && [[ "$SIG_HASH" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid signature values: size='$SIG_SIZE' hash='$SIG_HASH'"; exit 1; }
          sed -i -E "s/^(KSU_EXPECTED_SIZE := ).*/\1${SIG_SIZE}/" "$KB"
          sed -i -E "s/^(KSU_EXPECTED_HASH := ).*/\1${SIG_HASH}/" "$KB"
          echo "Manager signature: size=${SIG_SIZE} sha256=${SIG_HASH}"
          grep -n -E "KSU_EXPECTED_SIZE :=|KSU_EXPECTED_HASH :=|-DKSU_VERSION=|KSU_VERSION_FULL :=" "$KB" || true

      - name: Add SUSFS
        if: inputs.susfs == 'true'
        uses: ./.github/actions/susfs-patches

      - name: add nomount
        if: inputs.nomount == 'true'
        uses: ./.github/actions/nomount

      - name: Add BBG
        if: inputs.bbg == 'true'
        uses: ./.github/actions/bbg

      - name: Add unicodefix
        if: inputs.unicodefix == 'true'
        uses: ./.github/actions/unicode

      - name: Add droidspace support
        if: inputs.droidspace == 'true'
        uses: ./.github/actions/droidspaces

      - name: Add ntsync
        if: inputs.ntsync == 'true'
        uses: ./.github/actions/ntsync

      - name: Add bbrv3
        if: inputs.bbrv3 == 'true'
        uses: ./.github/actions/bbrv3

      - name: Add IP-SET and IPv6_NAT support
        if: inputs.ipv6_nat == 'true'
        uses: ./.github/actions/IPv6_NAT

      - name: Add TTL support
        if: inputs.ttl == 'true'
        uses: ./.github/actions/TTL

      - name: add optimization patches
        if: inputs.optimization == 'true' && !startsWith(env.BRANCH, 'SM-S711')
        uses: ./.github/actions/optimization

      - name: Set Kernel Configuration Variables
        if: inputs.bakasu == 'true' || inputs.finasu == 'true' || inputs.sukisu_nova == 'true'
        uses: ./.github/actions/configs

      - name: Clean Root Kconfig & Bypass check_defconfig
        run: |
          KERNEL_ROOT="${KERNEL_ROOT:-${COMMON:-$GITHUB_WORKSPACE/$CONFIG/kernel_platform/common}}"
          DEFCONFIG="${GKI_DEFCONFIG:-$KERNEL_ROOT/arch/arm64/configs/gki_defconfig}"

          if [ -f "$DEFCONFIG" ]; then
            sed -i '/CONFIG_KSU_NEXT/d' "$DEFCONFIG"
            sed -i '/CONFIG_KSU_KPROBES_HOOK/d' "$DEFCONFIG"
            if [[ "${{ inputs.bakasu }}" == "true" || "${{ inputs.finasu }}" == "true" || "${{ inputs.sukisu_nova }}" == "true" ]]; then
              grep -q "^CONFIG_KSU=y" "$DEFCONFIG" || echo "CONFIG_KSU=y" >> "$DEFCONFIG"
              if [[ "${{ inputs.susfs }}" == "true" ]]; then
                grep -q "^CONFIG_KSU_SUSFS=y" "$DEFCONFIG" || echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
              fi
              if [[ "${{ env.ROOT_PROVIDER }}" == "bakasu" || "${{ inputs.bakasu }}" == "true" ]]; then
                grep -q "^CONFIG_KALLSYMS=y" "$DEFCONFIG" || echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
                grep -q "^CONFIG_KALLSYMS_ALL=y" "$DEFCONFIG" || echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG"
              fi
            fi
          fi

          for cfg_file in "$KERNEL_ROOT/build.config.gki" "$KERNEL_ROOT/build.config.common"; do
            if [ -f "$cfg_file" ]; then
              sed -i 's/check_defconfig/:/g' "$cfg_file"
            fi
          done

      - name: Change Kernel Name and clean dirty
        uses: ./.github/actions/kernel-name

      - name: remove protected exports
        uses: ./.github/actions/abi-export

      - name: Set file name
        uses: ./.github/actions/file-name
        with:
          bakasu: ${{ inputs.bakasu }}
          susfs: ${{ inputs.susfs }}
          nomount: ${{ inputs.nomount }}
          bbg: ${{ inputs.bbg }}
          bbrv3: ${{ inputs.bbrv3 }}
          droidspaces: ${{ inputs.droidspace }}
          ntsync: ${{ inputs.ntsync }}
          ipv6_nat: ${{ inputs.ipv6_nat }}
          ttl: ${{ inputs.ttl }}
          unicodefix: ${{ inputs.unicodefix }}

      - name: Set Normie-Kernel and Root Variant Early in Output Filename
        run: |
          ROOT_TAG="${{ env.ROOT_PROVIDER }}"
          NEW_FILE_NAME="${FILE_NAME//Haroon-Kernel/Normie-Kernel}"
          NEW_FILE_NAME="${NEW_FILE_NAME//Haroon/Normie-Kernel}"

          for tag in sukisu-nova SukiSU-Nova finasu FinaSU bakasu BakaSU clean Clean; do
            NEW_FILE_NAME="${NEW_FILE_NAME%"-$tag"}"
          done

          if [[ "$NEW_FILE_NAME" == *"Normie-Kernel"* ]]; then
            NEW_FILE_NAME="${NEW_FILE_NAME/Normie-Kernel/Normie-Kernel-${ROOT_TAG}}"
          elif [ -n "$ARTIFACT_BASE" ] && [[ "$NEW_FILE_NAME" == "$ARTIFACT_BASE"* ]]; then
            NEW_FILE_NAME="${ARTIFACT_BASE}-Normie-Kernel-${ROOT_TAG}${NEW_FILE_NAME#"$ARTIFACT_BASE"}"
          else
            NEW_FILE_NAME="${NEW_FILE_NAME}-Normie-Kernel-${ROOT_TAG}"
          fi

          echo "FILE_NAME=$NEW_FILE_NAME" >> $GITHUB_ENV
          echo "Output FILE_NAME set to: $NEW_FILE_NAME"

      - name: change variables to ccache
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        uses: ./.github/actions/use-ccache

      - name: configure LTO
        uses: ./.github/actions/lto

      - name: Build
        uses: ./.github/actions/build
        with:
          build_type: ${{ inputs.build_type }}

      - name: Verify Kernel Image & Surface Compiler Errors
        run: |
          IMAGE_FOUND=$(find "$CONFIG" -maxdepth 6 -type f \( -name "Image" -o -name "Image.gz" \) ! -path "*.git*" | head -n 1)
          if [ -z "$IMAGE_FOUND" ]; then
            echo "ERROR: No kernel Image found after Build step. Printing Bazel/Clang error output:"
            find "$CONFIG" -maxdepth 4 -type f -name "*.log" -exec grep -i -C 5 -E "error:|FAILED:|Build failed" {} + 2>/dev/null | tail -n 100 || true
            exit 1
          fi
          echo "Verified built kernel image: $IMAGE_FOUND"

      - name: Verify root driver is present in the kernel image
        if: env.ROOT_PROVIDER != 'clean'
        run: |
          IMAGE=$(find "$CONFIG" -maxdepth 6 -type f -name "Image" ! -path "*.git*" | head -n 1)
          [ -n "$IMAGE" ] || { echo "::error::No Image to inspect"; exit 1; }
          if ! grep -a -q -i -E "kernelsu|finasu|sukisu|bakasu" "$IMAGE"; then
            echo "::warning::No root-manager strings found in $IMAGE (can be normal when SUSFS hides symbols)"
          fi
          if grep -a -q "v0.0.0-00000000@unknown" "$IMAGE"; then
            echo "::error::Root driver was built with the fallback version v0.0.0-00000000@unknown; its manager will not detect it."
            [[ "$ROOT_PROVIDER" == "finasu" ]] && exit 1
          fi
          CFG=$(find "$CONFIG" -maxdepth 8 -type f -name ".config" 2>/dev/null | head -n 1 || true)
          if [ -n "$CFG" ]; then
            grep -E "^CONFIG_KSU=|^CONFIG_KPROBES=|^CONFIG_KALLSYMS_ALL=|^CONFIG_KSU_SUSFS=" "$CFG" || echo "::warning::KSU/KPROBES/KALLSYMS_ALL/KSU_SUSFS not found in $CFG"
            grep -q "^CONFIG_KSU=y" "$CFG" || echo "::warning::CONFIG_KSU=y is not set in the final .config"
          fi

      - name: clean up ccache
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        run: ccache -c

      - name: ccache stats
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        run: ccache -s -v || ccache -s

      - name: Prepare AnyKernel3
        uses: ./.github/actions/ak3zip-prep

      - name: Set AnyKernel3 Banner Name
        run: |
          if [ -f "AnyKernel3/anykernel.sh" ]; then
            sed -i 's/kernel\.string=.*/kernel.string=Normie Kernel/g' AnyKernel3/anykernel.sh
          fi

      - name: Upload AnyKernel3 Artifacts
        id: upload_ak3
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.FILE_NAME }}-AnyKernel3
          path: |
            ./AnyKernel3/**
          compression-level: 9

      - name: Scan and collect patch rejects
        if: ${{ always() }}
        run: |
          set -e
          CONFIG_DIR="$CONFIG"
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"
          mapfile -t REJS < <(find "$CONFIG_DIR" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej files under $CONFIG_DIR"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV
          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$CONFIG_DIR"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"
              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                ORIG_DEST="$REJECTS_DIR/${REL%.rej}"
                mkdir -p "$(dirname "$ORIG_DEST")"
                cp "$ORIG" "$ORIG_DEST"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      - name: Generate Build Summary
        if: ${{ always() }}
        run: |
          KERNEL_ROOT="${KERNEL_ROOT:-${COMMON:-$GITHUB_WORKSPACE/$CONFIG/kernel_platform/common}}"
          echo "# Kernel Build Summary" > build_summary.md
          echo "## ${{ env.FILE_NAME }}" >> build_summary.md
          echo "## Build Information" >> build_summary.md
          echo "- **Android Version**: ${ANDROID_VER}" >> build_summary.md
          echo "- **Kernel Version**: ${KERNEL_VER}" >> build_summary.md
          echo "- **Kernel Name**: Normie-Kernel" >> build_summary.md
          echo "- **Root Provider**: ${ROOT_PROVIDER}" >> build_summary.md
          if [[ "${{ inputs.bbg }}" == "true" ]]; then
            echo "- **BBG**: Enabled" >> build_summary.md
          else
            echo "- **BBG**: Disabled" >> build_summary.md
          fi
          echo "" >> build_summary.md

          if [[ "${{ env.ROOT_PROVIDER }}" == "sukisu-nova" && -d "$GITHUB_WORKSPACE/SukiSU-Nova" ]]; then
            SUKISU_COMMIT=$(git -C "$GITHUB_WORKSPACE/SukiSU-Nova" rev-parse HEAD)
            SUKISU_URL="https://github.com/SukiSU-Nova/SukiSU-Nova/commit/$SUKISU_COMMIT"
            echo "- **SukiSU-Nova**: [$SUKISU_COMMIT]($SUKISU_URL)" >> "$GITHUB_WORKSPACE/build_summary.md"
          elif [[ "${{ env.ROOT_PROVIDER }}" == "sukisu-nova" ]]; then
            echo "- **SukiSU-Nova**: enabled (commit unavailable)" >> build_summary.md
          elif [[ "${{ inputs.finasu }}" == "true" && -d "$GITHUB_WORKSPACE/FinaSU" ]]; then
            FINASU_COMMIT=$(git -C "$GITHUB_WORKSPACE/FinaSU" rev-parse HEAD)
            FINASU_URL="https://github.com/LyraVoid/FinaSU/commit/$FINASU_COMMIT"
            echo "- **FinaSU**: [$FINASU_COMMIT]($FINASU_URL)" >> "$GITHUB_WORKSPACE/build_summary.md"
          elif [[ "${{ inputs.finasu }}" == "true" ]]; then
            echo "- **FinaSU**: enabled (commit unavailable)" >> build_summary.md
          else
            BAKASU_DIR=""
            if [ -d "$KERNEL_ROOT/BakaSU" ]; then
              BAKASU_DIR="$KERNEL_ROOT/BakaSU"
            elif [ -d "$KERNEL_ROOT/KernelSU" ]; then
              BAKASU_DIR="$KERNEL_ROOT/KernelSU"
            fi

            if [ -n "$BAKASU_DIR" ]; then
              cd "$BAKASU_DIR"
              BAKASU_COMMIT=$(git rev-parse HEAD)
              BAKASU_URL="https://github.com/Baka-SU/BakaSU/commit/$BAKASU_COMMIT"
              echo "- **BakaSU**: [$BAKASU_COMMIT]($BAKASU_URL)" >> "$GITHUB_WORKSPACE/build_summary.md"
              cd "$GITHUB_WORKSPACE"
            else
              echo "- **BakaSU**: not present" >> build_summary.md
            fi
          fi

          if [ -d "$CONFIG/Baseband-guard" ]; then
            cd "$CONFIG/Baseband-guard"
            BBG_COMMIT=$(git rev-parse HEAD)
            BBG_URL="https://github.com/vc-teahouse/Baseband-guard/commit/$BBG_COMMIT"
            echo "- **Baseband-guard**: [$BBG_COMMIT]($BBG_URL)" >> "$GITHUB_WORKSPACE/build_summary.md"
            cd "$GITHUB_WORKSPACE"
          else
            echo "- **Baseband-guard**: not present" >> build_summary.md
          fi

          if [ -d "$GITHUB_WORKSPACE/susfs4ksu" ]; then
            cd "$GITHUB_WORKSPACE/susfs4ksu"
            SUSFS_COMMIT=$(git rev-parse HEAD)
            SUSFS_URL="https://gitlab.com/simonpunk/susfs4ksu/-/commit/$SUSFS_COMMIT"
            echo "- **SUSFS4KSU**: [$SUSFS_COMMIT]($SUSFS_URL)" >> "$GITHUB_WORKSPACE/build_summary.md"
            cd "$GITHUB_WORKSPACE"
          else
            echo "- **SUSFS4KSU**: not present" >> build_summary.md
          fi
          echo "" >> build_summary.md

          echo "## Build Artifacts" >> build_summary.md
          if [ -d "AnyKernel3" ] && [ -f "AnyKernel3/Image" ]; then
            AK3_STATUS="✅"
          else
            AK3_STATUS="❌"
          fi
          echo "- **AnyKernel3**: $AK3_STATUS ${{ env.FILE_NAME }}-AnyKernel3" >> build_summary.md

          echo "### Misc (uploaded files)" >> build_summary.md
          FILES_PRESENT=0
          for f in "${{ env.FILE_NAME }}-Image" "${{ env.FILE_NAME }}-Image.gz" "${{ env.FILE_NAME }}-Image.lz4" "${{ env.FILE_NAME }}-boot.img" "${{ env.FILE_NAME }}-boot-gz.img" "${{ env.FILE_NAME }}-boot-lz4.img"; do
            if [ -f "$f" ]; then FILES_PRESENT=$((FILES_PRESENT+1)); fi
          done
          if [ "$FILES_PRESENT" -gt 0 ]; then
            MISC_STATUS="✅"
          else
            MISC_STATUS="❌"
          fi
          echo "- **Set**: $MISC_STATUS ${{ env.FILE_NAME }}-Misc" >> build_summary.md
          if [ "$MISC_STATUS" = "✅" ]; then
            echo "  Included:" >> build_summary.md
            for f in "${{ env.FILE_NAME }}-Image" "${{ env.FILE_NAME }}-Image.gz" "${{ env.FILE_NAME }}-Image.lz4" "${{ env.FILE_NAME }}-boot.img" "${{ env.FILE_NAME }}-boot-gz.img" "${{ env.FILE_NAME }}-boot-lz4.img"; do
              if [ -f "$f" ]; then
                echo "  - $f" >> build_summary.md
              fi
            done
          fi

          echo "### Diagnostics" >> build_summary.md
          echo "- **Rejected Patches**: ${{ env.FILE_NAME }}-Rejected-Patches" >> build_summary.md
          if [ -f patch-rejects/index.txt ]; then
            if [ -s patch-rejects/index.txt ]; then
              echo "  Rejected files:" >> build_summary.md
              while IFS= read -r line; do
                echo "    - $line" >> build_summary.md
              done < patch-rejects/index.txt
            else
              echo "  Rejected file list is empty." >> build_summary.md
            fi
          else
            echo "  No rejected patches found." >> build_summary.md
          fi
